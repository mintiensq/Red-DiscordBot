<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Reset 66</title>
  <meta name="description" content="Build a new habit in 66 days." />
  <meta name="theme-color" content="#0b0d18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reset 66" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="today" class="active"><span class="ti">◎</span><span>Today</span></button>
    <button data-tab="journey"><span class="ti">▦</span><span>Journey</span></button>
    <button data-tab="settings"><span class="ti">⚙︎</span><span>Settings</span></button>
  </nav>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" id="sheet-panel"></div>
  </div>

  <div id="confetti" class="confetti"></div>

  <script src="app.js"></script>
</body>
</html>
