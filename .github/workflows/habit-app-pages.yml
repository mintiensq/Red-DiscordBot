name: Deploy habit app to GitHub Pages

on:
  push:
    branches: [claude/nifty-davinci-82xnbe]
    paths: ["habit-app/**", ".github/workflows/habit-app-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: habit-app-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: habit-app
      - id: deployment
        uses: actions/deploy-pages@v4
